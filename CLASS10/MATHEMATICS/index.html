<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYANSETU ODISHA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:linear-gradient(135deg,#075985,#2563eb);color:#fff;text-align:center;padding:22px 14px}
header h1{margin:0;font-size:24px}header p{margin:8px 0 0}
.container{max-width:760px;margin:18px auto;padding:0 13px}
.back-btn{display:block;width:100%;text-align:center;background:#0645AD;color:#fff;padding:13px;margin:0 0 16px;border:0;border-radius:11px;font-size:17px;font-weight:bold;cursor:pointer}
.info{background:#e0f2fe;border-left:4px solid #0284c7;padding:12px;border-radius:8px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.stat{background:#fff;border-radius:10px;padding:12px;text-align:center;box-shadow:0 2px 9px #0000000d}
.stat strong{display:block;font-size:21px;color:#075985;margin-bottom:4px}
.stat span{font-size:12px;color:#475569}
.search{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin:5px 0 12px;background:#fff}
.progress-wrap{background:#dbeafe;height:10px;border-radius:20px;overflow:hidden;margin:7px 0 14px}
#progressBar{height:100%;width:0;background:#16a34a;transition:width .2s}
.progress-label{font-size:13px;color:#475569}
#status{text-align:center;padding:20px;color:#475569}
.chapter{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;margin:11px 0;padding:14px;border-radius:11px;box-shadow:0 3px 12px #00000012}
.chapter-title{font-weight:700;overflow-wrap:anywhere;flex:1}
.chapter-meta{font-size:12px;color:#64748b;margin-top:5px}
.badge{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:20px;background:#dcfce7;color:#166534;font-size:11px;font-weight:bold}
.open-btn{flex-shrink:0;text-decoration:none;background:#2563eb;color:white;padding:11px 14px;border-radius:8px;font-weight:bold;border:0;cursor:pointer}
#reader{display:none;width:100%;height:calc(100vh - 165px);min-height:500px;border:0;background:#fff;border-radius:10px}
.empty{text-align:center;padding:18px;color:#64748b}
footer{text-align:center;color:#64748b;padding:20px 10px;font-size:13px}
@media(max-width:420px){.chapter{padding:11px}.open-btn{padding:10px}.stats{gap:7px}}
</style>
</head>
<body>
<header><h1>GYANSETU ODISHA</h1><p id="subject">Loading subject...</p></header>
<main class="container">
<button class="back-btn" id="backButton" type="button">← BACK</button>
<section id="chapterPage">
<div class="info">Chapter ବାଛି OPEN କରନ୍ତୁ। ଆପଣଙ୍କର ପ୍ରଗତି ଏହି ଫୋନ୍‌ରେ ସେଭ୍ ହେବ।</div>
<div class="stats">
 <div class="stat"><strong id="totalCount">0</strong><span>Total Chapters</span></div>
 <div class="stat"><strong id="completedCount">0</strong><span>Completed Chapters</span></div>
 <div class="stat"><strong id="attemptCount">0</strong><span>Tests Attempted</span></div>
 <div class="stat"><strong id="bestScore">-</strong><span>Best Score</span></div>
</div>
<div class="progress-label" id="progressLabel">Chapter completion: 0%</div>
<div class="progress-wrap"><div id="progressBar"></div></div>
<input class="search" id="searchBox" type="search" placeholder="🔍 Search chapter...">
<div id="status">Chapter ଖୋଜା ଚାଲିଛି...</div><div id="chapters"></div>
</section>
<iframe id="reader" title="Chapter Test"></iframe>
</main>
<footer>© GyanSetu Odisha</footer>
<script>
const backButton=document.getElementById('backButton');
const chapterPage=document.getElementById('chapterPage');
const reader=document.getElementById('reader');
const chaptersEl=document.getElementById('chapters');
const searchBox=document.getElementById('searchBox');
let chapterFiles=[];
let currentChapter='';
const pathParts=location.pathname.split('/').filter(Boolean);
const repoIndex=pathParts.indexOf('Quiz-Notes');
const folderParts=repoIndex>=0?pathParts.slice(repoIndex+1):[];
if(folderParts.length && folderParts[folderParts.length-1].toLowerCase()==='index.html')folderParts.pop();
const subjectName=folderParts.length?folderParts[folderParts.length-1]:'SUBJECT';
const className=folderParts.length>1?folderParts[folderParts.length-2]:'';
const storageKey='gyansetu_progress_v1_'+folderParts.join('_');
function readData(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){return {}}}
function saveData(data){localStorage.setItem(storageKey,JSON.stringify(data))}
function refreshStats(){
 const data=readData(), records=Object.values(data);
 const completed=records.filter(x=>x.completed).length;
 const attempts=records.reduce((n,x)=>n+(x.attempts||0),0);
 const scores=records.filter(x=>typeof x.bestPercent==='number').map(x=>x.bestPercent);
 const best=scores.length?Math.max(...scores):null;
 document.getElementById('totalCount').textContent=chapterFiles.length;
 document.getElementById('completedCount').textContent=completed;
 document.getElementById('attemptCount').textContent=attempts;
 document.getElementById('bestScore').textContent=best===null?'-':best+'%';
 const percent=chapterFiles.length?Math.round(completed/chapterFiles.length*100):0;
 document.getElementById('progressLabel').textContent='Chapter completion: '+percent+'%';
 document.getElementById('progressBar').style.width=percent+'%';
}
function showChapter(url,name){
 currentChapter=name;
 reader.src=url;
 chapterPage.style.display='none';
 reader.style.display='block';
 backButton.textContent='← BACK TO CHAPTERS';
 window.scrollTo(0,0);
}
function showList(){
 reader.src='about:blank';reader.style.display='none';
 chapterPage.style.display='block';
 backButton.textContent='← BACK';
 currentChapter='';
 refreshStats();renderChapters(searchBox.value);
 window.scrollTo(0,0);
}
backButton.addEventListener('click',()=>{if(reader.style.display==='block'){showList()}else if(window.history.length>1){window.history.back()}else{window.location.href=new URL('../../index.html',window.location.href).href}});
function renderChapters(query=''){
 const data=readData(), q=query.trim().toLowerCase();
 chaptersEl.innerHTML='';
 const visible=chapterFiles.filter(f=>f.displayName.toLowerCase().includes(q));
 if(!visible.length){chaptersEl.innerHTML='<div class="empty">କୌଣସି Chapter ମିଳିଲା ନାହିଁ।</div>';return}
 visible.forEach((file)=>{
  const rec=data[file.name]||{};
  const card=document.createElement('div');card.className='chapter';
  const box=document.createElement('div');box.style.flex='1';
  const title=document.createElement('div');title.className='chapter-title';title.textContent=file.displayName;
  if(rec.completed){const badge=document.createElement('span');badge.className='badge';badge.textContent='COMPLETED';title.appendChild(badge)}
  const meta=document.createElement('div');meta.className='chapter-meta';
  meta.textContent=rec.attempts?('Attempts: '+rec.attempts+' | Best: '+(rec.bestPercent??'-')+'%'):'Not attempted yet';
  box.appendChild(title);box.appendChild(meta);
  const btn=document.createElement('button');btn.className='open-btn';btn.type='button';btn.textContent='OPEN ▶';
  btn.addEventListener('click',()=>showChapter(encodeURIComponent(file.name),file.name));
  card.appendChild(box);card.appendChild(btn);chaptersEl.appendChild(card);
 });
}
searchBox.addEventListener('input',()=>renderChapters(searchBox.value));
// Quiz pages should send a result message to this parent page after a test is submitted.
// Expected message: {type:'GYANSETU_TEST_RESULT', score:8, total:10}
window.addEventListener('message',(event)=>{
 if(event.origin!==location.origin || !event.data || event.data.type!=='GYANSETU_TEST_RESULT' || !currentChapter)return;
 const score=Number(event.data.score), total=Number(event.data.total);
 if(!Number.isFinite(score)||!Number.isFinite(total)||total<=0||score<0)return;
 const data=readData(), old=data[currentChapter]||{};
 const percent=Math.round(score/total*100);
 old.attempts=(old.attempts||0)+1;
 old.completed=true;
 old.lastScore=score;old.lastTotal=total;old.lastPercent=percent;
 old.bestPercent=Math.max(old.bestPercent||0,percent);
 old.lastAttempt=new Date().toISOString();
 data[currentChapter]=old;saveData(data);
});
(async function(){
 document.getElementById('subject').textContent=(className?className+' | ':'')+subjectName;
 const status=document.getElementById('status');
 try{
  if(repoIndex<0||folderParts.length===0)throw new Error('Subject folder path not identified');
  const api='https://api.github.com/repos/silusahu360/Quiz-Notes/contents/'+folderParts.map(encodeURIComponent).join('/')+'?ref=main';
  const response=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}});
  if(!response.ok)throw new Error('GitHub API response '+response.status);
  const files=await response.json();
  const htmlFiles=files.filter(f=>f.type==='file'&&/\.html?$/i.test(f.name)&&f.name.toLowerCase()!=='index.html').sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  chapterFiles=htmlFiles.map(f=>({name:f.name,displayName:f.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ')}));
  status.remove();
  if(!chapterFiles.length){chaptersEl.innerHTML='<div class="empty">ଏପର୍ଯ୍ୟନ୍ତ କୌଣସି Chapter HTML ଫାଇଲ୍ ମିଳିଲା ନାହିଁ।</div>';refreshStats();return}
  renderChapters();refreshStats();
 }catch(e){status.textContent='Chapter ଲୋଡ୍ ହେଲା ନାହିଁ। Internet connection ଯାଞ୍ଚ କରନ୍ତୁ।';console.error(e)}
})();
</script>
</body>
</html>
