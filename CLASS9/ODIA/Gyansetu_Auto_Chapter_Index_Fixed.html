<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYANSETU ODISHA - Chapters</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:linear-gradient(135deg,#075985,#2563eb);color:white;text-align:center;padding:25px 14px}
header h1{margin:0;font-size:25px}
header p{margin:9px 0 0}
.container{max-width:720px;margin:22px auto;padding:0 14px}
.info{background:#e0f2fe;border-left:4px solid #0284c7;padding:13px;border-radius:8px;margin-bottom:18px}
#status{text-align:center;padding:22px;color:#475569}
.chapter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;margin:12px 0;padding:17px;border-radius:12px;box-shadow:0 3px 12px #00000012}
.chapter-title{font-weight:700;overflow-wrap:anywhere}
.chapter a{flex-shrink:0;text-decoration:none;background:#2563eb;color:white;padding:11px 16px;border-radius:8px;font-weight:bold}
.chapter a:active{background:#075985}
footer{text-align:center;color:#64748b;padding:25px 10px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>GYANSETU ODISHA</h1>
<p id="subject">Loading subject...</p>
</header>
<main class="container">
<div class="info">ଏହି ବିଷୟରେ ଥିବା ସମସ୍ତ HTML Chapter ଏଠାରେ ଆପେଆପେ ଦେଖାଯିବ। ନୂଆ HTML ଫାଇଲ୍ Upload କଲେ ତାହା ମଧ୍ୟ ଏଠାରେ ଆସିବ।</div>
<div id="status">Chapter ଖୋଜା ଚାଲିଛି...</div>
<div id="chapters"></div>
</main>
<footer>© GyanSetu Odisha</footer>
<script>
(async function(){
  const parts = location.pathname.split('/').filter(Boolean);
  const repoIndex = parts.indexOf('Quiz-Notes');
  const folderParts = repoIndex >= 0 ? parts.slice(repoIndex + 1) : [];
  // GitHub Pages may open this page as /SUBJECT/index.html.
  if (folderParts.length && folderParts[folderParts.length - 1].toLowerCase() === 'index.html') folderParts.pop();
  const folderPath = folderParts.join('/');
  const subjectName = folderParts.length ? folderParts[folderParts.length - 1] : 'SUBJECT';
  const className = folderParts.length > 1 ? folderParts[folderParts.length - 2] : '';
  document.getElementById('subject').textContent = className + ' | ' + subjectName;
  const status = document.getElementById('status');
  const list = document.getElementById('chapters');
  try {
    const api = 'https://api.github.com/repos/silusahu360/Quiz-Notes/contents/' +
                folderPath.split('/').map(encodeURIComponent).join('/') + '?ref=main';
    const response = await fetch(api, {headers:{'Accept':'application/vnd.github+json'}});
    if(!response.ok) throw new Error('GitHub API response: ' + response.status);
    const files = await response.json();
    const htmlFiles = files.filter(f => f.type === 'file' &&
      /\.html?$/i.test(f.name) && f.name.toLowerCase() !== 'index.html')
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
    status.remove();
    if(htmlFiles.length === 0){
      status.textContent = 'ଏପର୍ଯ୍ୟନ୍ତ କୌଣସି Chapter HTML ଫାଇଲ୍ ମିଳିଲା ନାହିଁ।';
      list.appendChild(status);
      return;
    }
    htmlFiles.forEach((file,i)=>{
      const card=document.createElement('div');
      card.className='chapter';
      const title=document.createElement('div');
      title.className='chapter-title';
      title.textContent=(i+1)+'. '+file.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ');
      const link=document.createElement('a');
      link.textContent='OPEN ▶';
      link.href=encodeURIComponent(file.name);
      card.appendChild(title);
      card.appendChild(link);
      list.appendChild(card);
    });
  } catch(error) {
    status.textContent='Chapter ଲୋଡ୍ ହେଲା ନାହିଁ। Internet connection ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।';
    console.error(error);
  }
})();
</script>
</body>
</html>
